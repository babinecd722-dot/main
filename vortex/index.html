<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050508;--bg2:#0c0c14;--bg3:#13131f;--bg4:#1b1b2d;
  --card:rgba(18,18,30,0.65);--card-solid:#12121e;
  --accent:#7c5cfc;--accent2:#b44dff;--accent3:#ff6b9d;
  --grad:linear-gradient(135deg,#7c5cfc,#b44dff,#ff6b9d);
  --grad2:linear-gradient(135deg,#7c5cfc 0%,#b44dff 50%,#ff6b9d 100%);
  --text:#eeeef5;--text2:#9494b8;--text3:#5a5a7a;
  --border:rgba(255,255,255,0.04);--glow:rgba(124,92,252,0.15);
  --green:#3ddc84;--blue:#5b9bff;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.s-ring{width:120px;height:120px;position:relative;margin-bottom:32px}
.s-ring svg{width:120px;height:120px;animation:sRot 2s linear infinite}
.s-ring .logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes sRot{to{transform:rotate(360deg)}}
.s-title{font-size:14px;letter-spacing:8px;text-transform:uppercase;color:var(--text2);animation:fadeUp .8s .3s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* CANVAS BG */
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4}

/* LAYOUT */
.app{display:flex;height:100vh;position:relative;z-index:1}

/* SIDEBAR */
.side{width:320px;min-width:320px;background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border);position:relative;overflow:hidden}
.side::after{content:'';position:absolute;top:0;right:0;width:1px;height:100%;background:linear-gradient(to bottom,var(--accent) 0%,transparent 30%,transparent 70%,var(--accent2) 100%);opacity:.3}
.side-top{padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between}
.side-brand{display:flex;align-items:center;gap:10px}
.side-brand .mark{width:34px;height:34px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;box-shadow:0 4px 20px var(--glow)}
.side-brand span{font-weight:700;font-size:17px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.side-actions{display:flex;gap:2px}

.ib{width:34px;height:34px;border:none;background:transparent;color:var(--text2);cursor:pointer;border-radius:10px;display:flex;align-items:center;justify-content:center;transition:.2s}
.ib:hover{background:var(--bg4);color:var(--text)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.side-search{padding:14px 18px 6px}
.side-search input{width:100%;padding:9px 14px 9px 36px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none;transition:.3s}
.side-search input:focus{border-color:rgba(124,92,252,.4);box-shadow:0 0 0 3px rgba(124,92,252,.08)}
.side-search{position:relative}
.side-search svg{position:absolute;left:30px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2}

/* TABS */
.side-tabs{display:flex;gap:0;padding:8px 18px 0;border-bottom:1px solid var(--border)}
.stab{padding:8px 0;margin-right:20px;font-size:12.5px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.stab.active{color:var(--text);border-color:var(--accent)}
.stab:hover{color:var(--text2)}

.chats{flex:1;overflow-y:auto;padding:6px 8px}
.chats::-webkit-scrollbar{width:3px}
.chats::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

.ci{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;cursor:pointer;transition:.2s;position:relative}
.ci:hover{background:rgba(124,92,252,.06)}
.ci.act{background:rgba(124,92,252,.1);box-shadow:inset 0 0 0 1px rgba(124,92,252,.15)}
.ci .av{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;position:relative;overflow:hidden}
.ci .av img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.ci .av::after{content:'';position:absolute;inset:0;border-radius:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.av.g1{background:linear-gradient(135deg,#667eea,#764ba2)}.av.g2{background:linear-gradient(135deg,#f093fb,#f5576c)}.av.g3{background:linear-gradient(135deg,#4facfe,#00f2fe)}.av.g4{background:linear-gradient(135deg,#43e97b,#38f9d7)}.av.g5{background:linear-gradient(135deg,#fa709a,#fee140)}.av.g6{background:linear-gradient(135deg,#a18cd1,#fbc2eb)}.av.g7{background:linear-gradient(135deg,#fccb90,#d57eeb)}
.on-dot{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2.5px solid var(--bg2)}
.ci .inf{flex:1;min-width:0}
.ci .inf .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ci .inf .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .inf .tm{font-size:11px;color:var(--text3);flex-shrink:0}
.ci .inf .prev{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .inf .prev.typ{color:var(--accent);font-style:italic}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--grad);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
.pin-icon{color:var(--text3);flex-shrink:0}
.pin-icon svg{width:14px;height:14px;fill:currentColor}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 20%,rgba(124,92,252,.04) 0%,transparent 60%);pointer-events:none}

/* CHAT HEADER */
.ch{padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:rgba(12,12,20,.7);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);position:relative;z-index:3}
.ch-left{display:flex;align-items:center;gap:11px}
.ch-left .av{width:36px;height:36px;border-radius:11px;font-size:14px}
.ch-info .nm{font-size:14px;font-weight:600}
.ch-info .st{font-size:11.5px;color:var(--green);display:flex;align-items:center;gap:4px}
.ch-info .st.off{color:var(--text3)}
.ch-info .st::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.ch-right{display:flex;gap:2px}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:16px 22px 16px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.msgs::-webkit-scrollbar{width:4px}
.msgs::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
.m-date{text-align:center;padding:10px 0}
.m-date span{background:rgba(20,20,35,.8);backdrop-filter:blur(10px);color:var(--text3);font-size:11.5px;font-weight:500;padding:4px 12px;border-radius:8px;border:1px solid var(--border)}
.m{max-width:58%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;position:relative;animation:mIn .3s cubic-bezier(.4,1.6,.6,1) both}
@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.m.in{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,252,.85),rgba(180,77,255,.8));border-bottom-right-radius:4px;box-shadow:0 2px 16px rgba(124,92,252,.2)}
.m-t{font-size:10px;color:rgba(255,255,255,.35);margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.m.out .m-t{color:rgba(255,255,255,.55)}
.m .ticks svg{width:13px;height:13px;fill:currentColor}
.m.out .ticks{color:rgba(255,255,255,.7)}

/* Reactions */
.m-rx{display:flex;gap:3px;margin-top:4px}
.rx{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:1px 7px;font-size:13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:2px}
.rx:hover{border-color:var(--accent);transform:scale(1.08);background:rgba(124,92,252,.1)}
.rx .c{font-size:10px;color:var(--text2)}

/* Image msg */
.m-img{border-radius:10px;overflow:hidden;margin:-4px -6px 4px;max-width:260px}
.m-img img{width:100%;display:block;border-radius:10px}

/* Voice msg */
.m-voice{display:flex;align-items:center;gap:8px;min-width:180px}
.v-play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.v-play:hover{background:rgba(255,255,255,.2)}
.v-play svg{width:12px;height:12px;fill:currentColor}
.v-bars{flex:1;display:flex;align-items:center;gap:1.5px;height:24px}
.v-bars span{width:2.5px;border-radius:2px;background:rgba(255,255,255,.35)}
.v-dur{font-size:11px;color:rgba(255,255,255,.5)}

/* Typing */
.typing{display:none;gap:3px;padding:10px 14px;align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px}
.typing.show{display:flex}
.typing span{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:tb 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-6px);opacity:1}}

/* INPUT */
.inp-area{padding:10px 18px 14px;background:rgba(12,12,20,.7);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;position:relative;z-index:3}
.inp-wrap{flex:1;position:relative}
.inp-wrap textarea{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none;resize:none;min-height:40px;max-height:110px;transition:.3s;line-height:1.4}
.inp-wrap textarea::placeholder{color:var(--text3)}
.inp-wrap textarea:focus{border-color:rgba(124,92,252,.4);box-shadow:0 0 0 3px rgba(124,92,252,.06)}
.send{width:40px;height:40px;border:none;border-radius:12px;background:var(--grad);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.send:hover{transform:scale(1.06);box-shadow:0 4px 20px var(--glow)}
.send:active{transform:scale(.94)}
.send svg{width:18px;height:18px;fill:currentColor}
.inp-btns{display:flex;gap:1px;padding-bottom:3px}

/* GIFT MARKET OVERLAY */
.gift-overlay{position:fixed;inset:0;z-index:100;background:rgba(5,5,8,.85);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;opacity:0;transition:.3s}
.gift-overlay.show{display:flex;opacity:1}
.gift-panel{width:460px;max-height:80vh;background:var(--bg2);border:1px solid var(--border);border-radius:20px;overflow:hidden;transform:scale(.92);transition:.35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.gift-overlay.show .gift-panel{transform:scale(1)}
.gift-head{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.gift-head h2{font-size:20px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gift-close{width:32px;height:32px;border:none;background:var(--bg3);color:var(--text2);border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.gift-close:hover{background:var(--bg4);color:var(--text)}
.gift-sub{padding:6px 24px 16px;font-size:12.5px;color:var(--text2)}
.gift-cats{display:flex;gap:6px;padding:0 24px 12px;overflow-x:auto}
.gift-cats::-webkit-scrollbar{display:none}
.gcat{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:.2s}
.gcat.active{background:rgba(124,92,252,.15);color:var(--accent);border-color:rgba(124,92,252,.3)}
.gcat:hover{background:var(--bg4)}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 24px 24px;overflow-y:auto;max-height:50vh}
.gift-grid::-webkit-scrollbar{width:3px}
.gift-grid::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.gift-item{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.gift-item::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:0;transition:.3s}
.gift-item:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(124,92,252,.15);border-color:rgba(124,92,252,.2)}
.gift-item:hover::before{opacity:.06}
.gift-emoji{font-size:40px;display:block;margin-bottom:8px;position:relative;z-index:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));transition:.3s}
.gift-item:hover .gift-emoji{transform:scale(1.15) rotate(-5deg)}
.gift-name{font-size:12px;font-weight:600;position:relative;z-index:1;margin-bottom:4px}
.gift-price{font-size:11px;color:var(--accent);font-weight:700;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:3px}
.gift-price svg{width:12px;height:12px;fill:currentColor}
.gift-limited{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;background:var(--grad);color:#fff;padding:2px 6px;border-radius:6px;z-index:1}
.gift-sent-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid rgba(124,92,252,.3);color:var(--text);padding:12px 24px;border-radius:14px;font-size:13px;font-weight:600;z-index:200;transition:.4s cubic-bezier(.34,1.56,.64,1);opacity:0;backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.gift-sent-toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* PROFILE PANEL */
.profile-panel{position:absolute;right:0;top:0;bottom:0;width:300px;background:rgba(12,12,20,.95);backdrop-filter:blur(30px);border-left:1px solid var(--border);z-index:10;transform:translateX(100%);transition:.35s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.profile-panel.show{transform:translateX(0)}
.pp-cover{height:120px;background:var(--grad);position:relative}
.pp-av{width:72px;height:72px;border-radius:20px;position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;border:3px solid var(--bg2);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pp-info{padding:48px 20px 20px;text-align:center}
.pp-name{font-size:18px;font-weight:700;margin-bottom:2px}
.pp-status{font-size:12px;color:var(--text2);margin-bottom:16px}
.pp-stats{display:flex;justify-content:center;gap:24px;margin-bottom:16px}
.pp-stat{text-align:center}
.pp-stat .n{font-size:16px;font-weight:700}
.pp-stat .l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.pp-section{padding:0 20px 16px}
.pp-section h4{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px}
.pp-gift-row{display:flex;gap:8px;flex-wrap:wrap}
.pp-gift{width:42px;height:42px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:.2s}
.pp-gift:hover{transform:scale(1.1);border-color:var(--accent)}

/* Notification popup */
.notif{position:fixed;top:20px;right:20px;z-index:150;background:rgba(18,18,30,.9);backdrop-filter:blur(20px);border:1px solid rgba(124,92,252,.2);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;transform:translateX(120%);transition:.4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:320px}
.notif.show{transform:translateX(0)}
.notif .av{width:38px;height:38px;border-radius:11px;flex-shrink:0;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.notif .n-body .n-name{font-size:13px;font-weight:600}
.notif .n-body .n-text{font-size:12px;color:var(--text2);margin-top:1px}

/* Emoji picker mini */
.emoji-bar{position:absolute;bottom:100%;left:0;right:0;background:rgba(12,12,20,.95);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:8px 14px;display:none;gap:4px;flex-wrap:wrap}
.emoji-bar.show{display:flex}
.emoji-bar span{font-size:22px;cursor:pointer;padding:4px;border-radius:6px;transition:.15s}
.emoji-bar span:hover{background:var(--bg4);transform:scale(1.2)}

/* Context menu */
.ctx{position:fixed;z-index:50;background:rgba(18,18,30,.95);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:160px;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none;animation:ctxIn .2s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.95) translateY(-4px)}to{opacity:1;transform:none}}
.ctx-item{padding:8px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;color:var(--text)}
.ctx-item:hover{background:rgba(124,92,252,.1)}
.ctx-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.ctx-item.danger{color:#ff5555}

/* Scrollbar global */
*{scrollbar-width:thin;scrollbar-color:var(--bg4) transparent}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="splash">
  <div class="s-ring">
    <svg viewBox="0 0 120 120"><defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c5cfc"/><stop offset="50%" stop-color="#b44dff"/><stop offset="100%" stop-color="#ff6b9d"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="none" stroke="url(#sg)" stroke-width="3" stroke-dasharray="80 260" stroke-linecap="round"/></svg>
    <div class="logo">V</div>
  </div>
  <div class="s-title">Vortex Messenger</div>
</div>

<div class="app">
<!-- SIDEBAR -->
<div class="side">
  <div class="side-top">
    <div class="side-brand"><div class="mark">V</div><span>Vortex</span></div>
    <div class="side-actions">
      <button class="ib" onclick="toggleGifts()"><svg viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2z"/><path d="M12 22V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></svg></button>
      <button class="ib"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
    </div>
  </div>
  <div class="side-search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" placeholder="Search..." id="searchInp" oninput="filterChats()">
  </div>
  <div class="side-tabs">
    <div class="stab active">All</div>
    <div class="stab">Personal</div>
    <div class="stab">Groups</div>
    <div class="stab">Channels</div>
  </div>
  <div class="chats" id="chatList"></div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="ch" id="chatHeader"></div>
  <div class="msgs" id="msgs"></div>
  <div class="inp-area">
    <div class="inp-btns">
      <button class="ib" onclick="toggleEmoji()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button>

// ===== PARTICLES =====
const canvas = document.getElementById('bgCanvas');
const cx = canvas.getContext('2d');
let particles = [];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();
for(let i=0;i<40;i++) particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+.5,dx:(Math.random()-.5)*.3,dy:(Math.random()-.5)*.3,o:Math.random()*.3+.1});
function animParticles(){
  cx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=`rgba(124,92,252,${p.o})`;cx.fill();
  });
  for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){
    const d=Math.hypot(particles[i].x-particles[j].x,particles[i].y-particles[j].y);
    if(d<120){cx.beginPath();cx.moveTo(particles[i].x,particles[i].y);cx.lineTo(particles[j].x,particles[j].y);cx.strokeStyle=`rgba(124,92,252,${.04*(1-d/120)})`;cx.stroke()}
  }
  requestAnimationFrame(animParticles);
}
animParticles();

function renderChatList(){

    if(prev.length>35)prev=prev.slice(0,35)+'...';
    const unread=c.msgs.filter(m=>m.who==='in'&&m.unread).length;
    const isTyp=i===currentChat&&c.online&&i===0;
    el.innerHTML+=`<div class="ci${i===currentChat?' act':''}" onclick="selectChat(${i})" oncontextmenu="chatCtx(event,${i})">

}

function renderMessages(){

    const cls=m.who==='out'?'out':'in';
    let inner='';
    if(m.img)inner+=`<div class="m-img"><img src="${m.img}" loading="lazy"></div>`;
    if(m.voice){
      const bars=Array.from({length:20},()=>`<span style="height:${4+Math.random()*16}px"></span>`).join('');
      inner+=`<div class="m-voice"><button class="v-play"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></button><div class="v-bars">${bars}</div><div class="v-dur">${m.dur}</div></div>`;
    }
    if(m.text){
      const t=m.text.replace(/\n/g,'<br>');
      inner+=m.from?`<div style="font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px">${m.from}</div>${t}`:t;
    }
    const ticks=m.who==='out'?`<span class="ticks"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg></span>`:'';
    html+=`<div class="m ${cls}" style="animation-delay:${i*0.06}s" oncontextmenu="msgCtx(event,${currentChat},${i})">${inner}<div class="m-t">${m.time} ${ticks}</div></div>`;
  });
  html+='<div class="typing" id="typing"><span></span><span></span><span></span></div>';

  requestAnimationFrame(()=>el.scrollTop=el.scrollHeight);
}

  document.getElementById('emojiBar').classList.remove('show');
  renderMessages();renderChatList();
  if(contacts[currentChat].online)simulateReply();
}

function simulateReply(){

    else showNotif(idx);

}

}

function msgCtx(e,ci,mi){
  e.preventDefault();

    <div class="ctx-item" onclick="copyMsg(${ci},${mi})"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</div>
    <div class="ctx-item" onclick="hideCtx()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Forward</div>
    <div class="ctx-item danger" onclick="deleteMsg(${ci},${mi})"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Delete</div>`;
}
function chatCtx(e,i){e.preventDefault();hideCtx()}
function hideCtx(){document.getElementById('ctx').style.display='none'}
function copyMsg(ci,mi){navigator.clipboard.writeText(contacts[ci].msgs[mi].text||'');hideCtx()}
function deleteMsg(ci,mi){contacts[ci].msgs.splice(mi,1);renderMessages();renderChatList();hideCtx()}
document.addEventListener('click',hideCtx);
