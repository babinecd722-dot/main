<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050508;--bg2:#0b0b14;--bg3:#111120;--bg4:#191930;--bg5:#222244;
  --card:rgba(14,14,24,.75);
  --accent:#7c5cfc;--accent2:#b44dff;--accent3:#ff6b9d;--accentG:linear-gradient(135deg,#7c5cfc,#b44dff,#ff6b9d);
  --premG:linear-gradient(135deg,#FFD700,#FFA500,#FF6B00);--premC:#FFD700;
  --text:#ededf5;--text2:#9090b0;--text3:#5a5a78;
  --border:rgba(255,255,255,.04);--glow:rgba(124,92,252,.12);
  --green:#3ddc84;--r:12px;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.s-logo{width:80px;height:80px;position:relative}
.s-logo svg{width:80px;height:80px;animation:sR 1.5s linear infinite}
@keyframes sR{to{transform:rotate(360deg)}}
.s-logo .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.s-logo .sl svg{width:32px;height:32px;animation:none}
.s-t{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--text2)}
.s-bar{width:160px;height:2px;background:var(--bg3);border-radius:2px;overflow:hidden}
.s-bar i{display:block;height:100%;width:0;background:var(--accentG);border-radius:2px;animation:sB 1.6s .3s ease forwards}
@keyframes sB{to{width:100%}}

/* ===== CANVAS ===== */
#bgC{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35}

/* ===== LAYOUT ===== */
.app{display:flex;height:100vh;position:relative;z-index:1}

/* ===== SIDEBAR ===== */
.side{width:310px;min-width:310px;background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--border)}
.s-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.s-brand{display:flex;align-items:center;gap:8px}
.s-mark{width:30px;height:30px;border-radius:9px;background:var(--accentG);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px var(--glow)}
.s-mark svg{width:15px;height:15px}
.s-brand span{font-weight:700;font-size:16px;background:var(--accentG);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.s-acts{display:flex;gap:1px}
.ib{width:32px;height:32px;border:none;background:0;color:var(--text2);cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.15s}
.ib:hover{background:var(--bg4);color:var(--text)}
.ib svg{width:17px;height:17px}
.s-search{padding:4px 14px 8px;position:relative}
.s-search input{width:100%;padding:8px 12px 8px 34px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12.5px;outline:0;transition:.2s}
.s-search input:focus{border-color:rgba(124,92,252,.35);box-shadow:0 0 0 2px rgba(124,92,252,.06)}
.s-search svg{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text3)}
.s-tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--border)}
.st{padding:7px 0;margin-right:16px;font-size:11.5px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.st.act{color:var(--text);border-color:var(--accent)}

/* CHAT LIST */
.cl{flex:1;overflow-y:auto;padding:6px}
.cl::-webkit-scrollbar{width:3px}.cl::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.ci{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);cursor:pointer;transition:.15s;position:relative}
.ci:hover{background:rgba(124,92,252,.05)}
.ci.act{background:rgba(124,92,252,.08);box-shadow:inset 0 0 0 1px rgba(124,92,252,.12)}

/* AVATARS */
.av{width:42px;height:42px;border-radius:13px;flex-shrink:0;position:relative;overflow:visible}
.av-inner{width:100%;height:100%;border-radius:13px;overflow:hidden;position:relative}
.av-inner img{width:100%;height:100%;object-fit:cover}
.av-inner .av-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff}
.av-ring{position:absolute;inset:-3px;border-radius:16px;padding:2px;pointer-events:none;opacity:0}
.av-ring.prem{opacity:1;background:var(--premG);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ringPulse 3s infinite}
@keyframes ringPulse{0%,100%{opacity:.8}50%{opacity:1}}
.av .on{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--bg2);z-index:2}
.av-sm{width:34px;height:34px;border-radius:11px}.av-sm .av-inner{border-radius:11px}.av-sm .av-ring{inset:-3px;border-radius:14px}

/* PREMIUM BADGE */
.pbadge{display:inline-flex;align-items:center;margin-left:4px;vertical-align:middle}
.pbadge svg{width:14px;height:14px}

.ci .inf{flex:1;min-width:0}
.ci .inf .top{display:flex;align-items:center;gap:4px;margin-bottom:2px}
.ci .inf .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .inf .tm{font-size:10.5px;color:var(--text3);margin-left:auto;flex-shrink:0}
.ci .inf .prev{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .inf .prev.typ{color:var(--accent)}
.badge{min-width:17px;height:17px;border-radius:9px;background:var(--accentG);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}

/* ===== MAIN ===== */
.main{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg)}

/* HEADER */
.ch{padding:10px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(11,11,20,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:3}
.ch-l{display:flex;align-items:center;gap:10px;cursor:pointer}
.ch-i .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:0}
.ch-i .sts{font-size:11px;display:flex;align-items:center;gap:4px}
.ch-i .sts.on{color:var(--green)}.ch-i .sts.off{color:var(--text3)}
.ch-i .sts::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.ch-r{display:flex;gap:1px}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:3px;z-index:1}
.msgs::-webkit-scrollbar{width:4px}.msgs::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
.m-date{text-align:center;padding:8px 0}.m-date span{background:rgba(17,17,32,.85);backdrop-filter:blur(8px);color:var(--text3);font-size:11px;font-weight:500;padding:3px 11px;border-radius:7px;border:1px solid var(--border)}
.m{max-width:55%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.5;position:relative;animation:mIn .25s cubic-bezier(.4,1.4,.6,1) both}
@keyframes mIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.m.in{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,252,.82),rgba(160,70,255,.78));border-bottom-right-radius:4px;box-shadow:0 2px 12px rgba(124,92,252,.15)}
.m-t{font-size:9.5px;color:rgba(255,255,255,.3);margin-top:2px;display:flex;align-items:center;justify-content:flex-end;gap:3px}
.m.out .m-t{color:rgba(255,255,255,.5)}
.m .ticks svg{width:12px;height:12px;fill:currentColor}
.m-from{font-size:10.5px;font-weight:600;color:var(--accent);margin-bottom:1px}
.m-img{border-radius:8px;overflow:hidden;margin:-3px -5px 3px;max-width:240px}.m-img img{width:100%;display:block;border-radius:8px}
.m-voice{display:flex;align-items:center;gap:7px;min-width:160px}
.vp{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.1);border:0;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}.vp svg{width:11px;height:11px;fill:currentColor}
.vb{flex:1;display:flex;align-items:center;gap:1.5px;height:22px}.vb span{width:2px;border-radius:2px;background:rgba(255,255,255,.3)}
.vd{font-size:10px;opacity:.5}

/* GIFT MESSAGE */
.m-gift{display:flex;flex-direction:column;align-items:center;padding:8px 16px;gap:4px}
.m-gift .g-anim{width:64px;height:64px}
.m-gift .g-label{font-size:11px;opacity:.7}

/* TYPING */
.typ-ind{display:none;gap:3px;padding:8px 12px;align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px}
.typ-ind.show{display:flex}
.typ-ind span{width:5px;height:5px;background:var(--text3);border-radius:50%;animation:tb 1.2s infinite}
.typ-ind span:nth-child(2){animation-delay:.15s}.typ-ind span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}

/* INPUT */
.inp{padding:8px 16px 12px;background:rgba(11,11,20,.75);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:7px;z-index:3;position:relative}
.inp textarea{flex:1;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-size:13px;font-family:inherit;outline:0;resize:none;min-height:38px;max-height:100px;transition:.2s;line-height:1.4}
.inp textarea:focus{border-color:rgba(124,92,252,.35);box-shadow:0 0 0 2px rgba(124,92,252,.06)}
.inp textarea::placeholder{color:var(--text3)}
.send{width:38px;height:38px;border:0;border-radius:var(--r);background:var(--accentG);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.send:hover{transform:scale(1.04);box-shadow:0 3px 14px var(--glow)}.send:active{transform:scale(.94)}
.send svg{width:16px;height:16px;fill:currentColor}

/* EMOJI BAR */
.ebar{position:absolute;bottom:100%;left:0;right:0;background:rgba(11,11,20,.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 12px;display:none;gap:2px;flex-wrap:wrap}
.ebar.show{display:flex}
.ebar span{font-size:20px;cursor:pointer;padding:3px;border-radius:6px;transition:.12s}
.ebar span:hover{background:var(--bg4);transform:scale(1.15)}

/* ===== GIFT OVERLAY ===== */
.go{position:fixed;inset:0;z-index:100;background:rgba(5,5,8,.88);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center}
.go.show{display:flex}
.gp{width:420px;max-height:78vh;background:var(--bg2);border:1px solid var(--border);border-radius:18px;overflow:hidden;transform:scale(.93);transition:.3s cubic-bezier(.34,1.5,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.go.show .gp{transform:scale(1)}
.gp-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.gp-head h2{font-size:18px;font-weight:700;background:var(--accentG);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gp-close{width:28px;height:28px;border:0;background:var(--bg3);color:var(--text2);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.gp-close:hover{background:var(--bg4);color:var(--text)}
.gp-sub{padding:4px 20px 14px;font-size:12px;color:var(--text2)}
.gp-to{padding:0 20px 10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.gp-to .av{width:24px;height:24px;border-radius:7px}.gp-to .av .av-inner{border-radius:7px}.gp-to .av .av-ring{inset:-2px;border-radius:9px}
.gp-to strong{color:var(--text)}
.gp-cats{display:flex;gap:5px;padding:0 20px 10px;overflow-x:auto}.gp-cats::-webkit-scrollbar{display:none}
.gc{padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:600;background:var(--bg3);color:var(--text2);border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:.15s}
.gc.act{background:rgba(124,92,252,.12);color:var(--accent);border-color:rgba(124,92,252,.25)}
.gp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 20px 20px;overflow-y:auto;max-height:48vh}
.gp-grid::-webkit-scrollbar{width:3px}.gp-grid::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.gi{background:var(--bg3);border:1px solid var(--border);border-radius:14px;padding:14px 8px 10px;text-align:center;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.gi:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(124,92,252,.1);border-color:rgba(124,92,252,.15)}
.gi:hover .g-svg{transform:scale(1.1)}
.g-svg{width:52px;height:52px;margin:0 auto 6px;transition:.25s;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.gi .gn{font-size:11px;font-weight:600;margin-bottom:2px}
.gi .gpr{font-size:10.5px;color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px}
.gi .gpr svg{width:10px;height:10px;fill:currentColor}
.gi .glim{position:absolute;top:5px;right:5px;font-size:8px;font-weight:800;background:var(--premG);color:#000;padding:1px 5px;border-radius:5px;letter-spacing:.5px}

/* SEND GIFT CONFIRM */
.g-confirm{position:fixed;inset:0;z-index:110;background:rgba(5,5,8,.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center}
.g-confirm.show{display:flex}
.gc-box{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px 36px;text-align:center;max-width:320px;transform:scale(.9);transition:.3s cubic-bezier(.34,1.5,.64,1)}
.g-confirm.show .gc-box{transform:scale(1)}
.gc-box .g-svg{width:80px;height:80px;margin:0 auto 12px}
.gc-box h3{font-size:16px;margin-bottom:4px}
.gc-box .gc-price{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:4px}
.gc-box .gc-to{font-size:12px;color:var(--text2);margin-bottom:16px}
.gc-btns{display:flex;gap:8px;justify-content:center}
.gc-btn{padding:9px 24px;border:0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.gc-btn.primary{background:var(--accentG);color:#fff}.gc-btn.primary:hover{transform:scale(1.03);box-shadow:0 4px 16px var(--glow)}
.gc-btn.secondary{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.gc-btn.secondary:hover{background:var(--bg4)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--bg3);border:1px solid rgba(124,92,252,.25);color:var(--text);padding:10px 20px;border-radius:12px;font-size:12.5px;font-weight:600;z-index:200;transition:.35s cubic-bezier(.34,1.5,.64,1);opacity:0;backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== PREMIUM OVERLAY ===== */
.prem-o{position:fixed;inset:0;z-index:100;background:rgba(5,5,8,.88);backdrop-filter:blur(16px);display:none;align-items:center;justify-content:center}
.prem-o.show{display:flex}
.prem-p{width:380px;background:var(--bg2);border:1px solid rgba(255,215,0,.15);border-radius:18px;overflow:hidden;transform:scale(.93);transition:.3s cubic-bezier(.34,1.5,.64,1);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.prem-o.show .prem-p{transform:scale(1)}
.prem-banner{height:100px;background:linear-gradient(135deg,#1a1000,#2a1800,#1a1000);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.prem-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,165,0,.05));animation:premShimmer 3s infinite}
@keyframes premShimmer{0%,100%{opacity:.3}50%{opacity:.6}}
.prem-badge-big{width:56px;height:56px}
.prem-body{padding:20px}
.prem-body h2{font-size:20px;font-weight:800;text-align:center;margin-bottom:2px;background:var(--premG);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.prem-body .prem-sub{text-align:center;font-size:12px;color:var(--text2);margin-bottom:16px}
.prem-features{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.pf{display:flex;align-items:center;gap:10px;font-size:12.5px}
.pf svg{width:18px;height:18px;flex-shrink:0}
.pf span{color:var(--text2)}
.prem-plans{display:flex;gap:8px;margin-bottom:14px}
.pp{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:.2s}
.pp:hover{border-color:rgba(255,215,0,.2)}
.pp.sel{border-color:var(--premC);box-shadow:0 0 0 2px rgba(255,215,0,.1)}
.pp .pp-dur{font-size:11px;color:var(--text2);margin-bottom:4px}
.pp .pp-price{font-size:18px;font-weight:800;background:var(--premG);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pp .pp-per{font-size:10px;color:var(--text3)}
.pp .pp-save{font-size:9px;color:var(--premC);font-weight:700;margin-top:2px}
.prem-buy{width:100%;padding:11px;border:0;border-radius:12px;background:var(--premG);color:#000;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 4px 20px rgba(255,215,0,.15)}
.prem-buy:hover{transform:scale(1.02);box-shadow:0 6px 24px rgba(255,215,0,.25)}

/* ===== PROFILE PANEL ===== */
.prof{position:absolute;right:0;top:0;bottom:0;width:280px;background:rgba(11,11,20,.95);backdrop-filter:blur(24px);border-left:1px solid var(--border);z-index:10;transform:translateX(100%);transition:.3s ease;overflow-y:auto}
.prof.show{transform:translateX(0)}
.prof::-webkit-scrollbar{width:3px}.prof::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.prof-cover{height:90px;position:relative;overflow:hidden}
.prof-cover-bg{position:absolute;inset:0}
.prof-av{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%)}
.prof-av .av{width:56px;height:56px;border-radius:17px}.prof-av .av .av-inner{border-radius:17px}.prof-av .av .av-ring{inset:-3px;border-radius:20px}
.prof-info{padding:36px 16px 12px;text-align:center}
.prof-nm{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:0}
.prof-bio{font-size:11.5px;color:var(--text2);margin-top:2px}
.prof-sts{font-size:11px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px}
.prof-sts.on{color:var(--green)}.prof-sts.off{color:var(--text3)}
.prof-sts::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.prof-stats{display:flex;justify-content:center;gap:20px;padding:8px 0 12px;border-bottom:1px solid var(--border);margin:0 16px}
.prof-stat{text-align:center}.prof-stat .n{font-size:15px;font-weight:700}.prof-stat .l{font-size:9.5px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.prof-section{padding:12px 16px}
.prof-section h4{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:8px;font-weight:600}
.prof-gifts{display:flex;gap:6px;flex-wrap:wrap}
.prof-gift{width:38px;height:38px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.prof-gift:hover{transform:scale(1.08);border-color:var(--accent)}
.prof-gift svg{width:22px;height:22px}
.prof-actions{padding:8px 16px 16px;display:flex;flex-direction:column;gap:6px}
.prof-btn{padding:8px;border:0;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.prof-btn.accent{background:rgba(124,92,252,.12);color:var(--accent);border:1px solid rgba(124,92,252,.15)}
.prof-btn.accent:hover{background:rgba(124,92,252,.2)}
.prof-btn.gold{background:rgba(255,215,0,.08);color:var(--premC);border:1px solid rgba(255,215,0,.12)}

  {name:"Fire Spirit",svg:"fire",price:50,cat:"Popular"},
  {name:"Eternal Rose",svg:"rose",price:35,cat:"Love"},
  {name:"Dragon Egg",svg:"dragon",price:300,cat:"Rare",lim:1},
  {name:"Teddy Bear",svg:"bear",price:20,cat:"Love"},
  {name:"Saturn Ring",svg:"saturn",price:120,cat:"Rare",lim:1},
  {name:"Champion",svg:"trophy",price:100,cat:"Premium"},
  {name:"Music Box",svg:"music",price:25,cat:"Fun"},
  {name:"Rocket",svg:"rocket",price:60,cat:"Fun"},
];

let cur=0,gCat="Popular",profOpen=false,premPlan=1,confirmGift=null;

// ===== PARTICLES =====
const cv=document.getElementById('bgC'),cx=cv.getContext('2d');let pts=[];
function rsz(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rsz);rsz();
for(let i=0;i<35;i++)pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.2+.4,dx:(Math.random()-.5)*.25,dy:(Math.random()-.5)*.25,o:Math.random()*.25+.08});
function anim(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`rgba(124,92,252,${p.o})`;cx.fill()});for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<100){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle=`rgba(124,92,252,${.03*(1-d/100)})`;cx.stroke()}}requestAnimationFrame(anim)}anim();

// ===== RENDER HELPERS =====
function mkAv(c,sz){
  const cls=sz==='sm'?'av av-sm':'av';
  const inner=c.av?`<img src="${c.av}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'';
  const fb=`<div class="av-fallback" style="background:${GRADS[c.grad]};${c.av?'display:none':''}">${c.letter||c.name[0]}</div>`;
  const ring=c.premium?'<div class="av-ring prem"></div>':'';
  const on=c.online?'<div class="on"></div>':'';
  return `<div class="${cls}">${ring}<div class="av-inner">${inner}${fb}</div>${on}</div>`;
}
function mkBadge(c){return c.premium?`<span class="pbadge">${SVG.premBadge}</span>`:''}
function gTime(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function gSvg(key,w){return `<div class="g-svg" style="width:${w||52}px;height:${w||52}px">${GIFT_SVG[key]||''}</div>`}

// ===== RENDERS =====
function rCL(){
  const el=document.getElementById('chatList');let h='';
  C.forEach((c,i)=>{
    const last=c.msgs[c.msgs.length-1];
    let prev=last.voice?'Voice message':last.gift?`Gift: ${last.gift}`:last.img?'Photo':(last.f?last.f+': ':'')+last.t;
    if(prev.length>32)prev=prev.slice(0,32)+'...';
    const unread=c.msgs.filter(m=>m.w==='in'&&m.unread).length;
    h+=`<div class="ci${i===cur?' act':''}" onclick="sel(${i})">${mkAv(c,'sm')}<div class="inf"><div class="top"><span class="nm">${c.name}${mkBadge(c)}</span><span class="tm">${last.tm}</span></div><div class="prev">${prev}</div></div>${unread?`<div class="badge">${unread}</div>`:''}</div>`;
  });
  el.innerHTML=h;
}

function rMsgs(){
  const el=document.getElementById('msgs'),c=C[cur];
  let h=`<div class="m-date"><span>${c.msgs[0].tm.match(/\d/)?'Today':c.msgs[0].tm}</span></div>`;
  c.msgs.forEach((m,i)=>{
    let inner='';
    if(m.img)inner+=`<div class="m-img"><img src="${m.img}" loading="lazy"></div>`;
    if(m.voice){const bars=Array.from({length:18},()=>`<span style="height:${3+Math.random()*14}px"></span>`).join('');inner+=`<div class="m-voice"><button class="vp"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></button><div class="vb">${bars}</div><div class="vd">${m.dur}</div></div>`}
    if(m.gift){inner+=`<div class="m-gift">${gSvg(m.giftSvg,64)}<div class="g-label">sent ${m.gift}</div></div>`}
    if(m.t){const t=m.t.replace(/\n/g,'<br>');inner+=(m.f?`<div class="m-from">${m.f}</div>`:'')+t}
    const ticks=m.w==='out'?`<span class="ticks">${SVG.tick}</span>`:'';
    h+=`<div class="m ${m.w==='out'?'out':'in'}" style="animation-delay:${i*.05}s" oncontextmenu="mCtx(event,${i})">${inner}<div class="m-t">${m.tm} ${ticks}</div></div>`;
  });
  h+='<div class="typ-ind" id="typI"><span></span><span></span><span></span></div>';
  el.innerHTML=h;
  requestAnimationFrame(()=>el.scrollTop=el.scrollHeight);
}

function rH(){
  const c=C[cur],st=c.isChannel?`${c.msgs.length} posts`:(c.online?'online':'last seen recently');
  document.getElementById('chatH').innerHTML=`<div class="ch-l" onclick="toggleProf()">${mkAv(c,'sm')}<div class="ch-i"><div class="nm">${c.name}${mkBadge(c)}</div><div class="sts ${c.online?'on':'off'}">${st}</div></div></div><div class="ch-r"><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg></button><button class="ib" onclick="toggleGifts()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></svg></button><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button></div>`;
}

function sel(i){cur=i;if(profOpen)toggleProf();rCL();rH();rMsgs()}

// GIFTS
function rGifts(){
  document.getElementById('gCats').innerHTML=GCATS.map(c=>`<div class="gc${c===gCat?' act':''}" onclick="gCat='${c}';rGifts()">${c}</div>`).join('');
  const c=C[cur];
  document.getElementById('giftTo').innerHTML=`Sending to ${mkAv(c)} <strong>${c.name}</strong>`;
  document.getElementById('gGrid').innerHTML=GIFTS.filter(g=>g.cat===gCat).map((g,i)=>`<div class="gi" onclick="confirmGiftSend(${GIFTS.indexOf(g)})" style="animation:mIn .25s ${i*.05}s both">${g.lim?'<div class="glim">LIMITED</div>':''}${gSvg(g.svg)}<div class="gn">${g.name}</div><div class="gpr">${SVG.coin} ${g.price}</div></div>`).join('');
}
function toggleGifts(){const o=document.getElementById('giftO');o.classList.toggle('show');if(o.classList.contains('show'))rGifts()}

function confirmGiftSend(idx){
  confirmGift=idx;const g=GIFTS[idx],c=C[cur];
  document.getElementById('gcBox').innerHTML=`${gSvg(g.svg,80)}<h3>${g.name}</h3><div class="gc-price">${SVG.coin} ${g.price} coins</div><div class="gc-to">Send to <strong>${c.name}</strong>?</div><div class="gc-btns"><button class="gc-btn secondary" onclick="closeConfirm()">Cancel</button><button class="gc-btn primary" onclick="doSendGift()">Send Gift</button></div>`;
  document.getElementById('gConf').classList.add('show');
}
function closeConfirm(){document.getElementById('gConf').classList.remove('show');confirmGift=null}
function doSendGift(){
  if(confirmGift===null)return;const g=GIFTS[confirmGift],c=C[cur];
  c.msgs.push({w:'out',t:'',gift:g.name,giftSvg:g.svg,tm:gTime(),r:0});
  closeConfirm();toggleGifts();rMsgs();rCL();
  showToast(`${g.name} sent to ${c.name}!`,g.svg);
  if(c.online)simReply();
}
function showToast(text,svg){
  const t=document.getElementById('toast');
  t.innerHTML=(svg?`<div style="width:24px;height:24px">${GIFT_SVG[svg]||''}</div>`:'')+text;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

// PREMIUM
function showPremium(){
  const o=document.getElementById('premO');
  if(o.classList.contains('show')){o.classList.remove('show');return}
  document.getElementById('premP').innerHTML=`<div class="prem-banner"><div class="prem-badge-big">${SVG.premBadgeBig}</div></div><div class="prem-body"><h2>Vortex Premium</h2><div class="prem-sub">Unlock the full experience</div><div class="prem-features"><div class="pf">${SVG.premBadge}<span>Exclusive golden badge next to your name</span></div><div class="pf"><svg viewBox="0 0 20 20" fill="#7c5cfc"><circle cx="10" cy="10" r="9" fill="none" stroke="#7c5cfc" stroke-width="1.5"/><path d="M10 5v10M5 10h10" stroke="#7c5cfc" stroke-width="1.5"/></svg><span>Animated avatar ring effect</span></div><div class="pf"><svg viewBox="0 0 20 20" fill="none"><path d="M10 2l2.5 5 5.5 1-4 4 1 5.5L10 15l-5 2.5 1-5.5-4-4 5.5-1z" stroke="#ff6b9d" stroke-width="1.5"/></svg><span>Access to Premium & Rare gifts</span></div><div class="pf"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="2" stroke="#3ddc84" stroke-width="1.5"/><path d="M2 8h16" stroke="#3ddc84" stroke-width="1.5"/></svg><span>Custom chat themes & colors</span></div><div class="pf"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#4facfe" stroke-width="1.5"/><path d="M10 6v4l3 3" stroke="#4facfe" stroke-width="1.5" stroke-linecap="round"/></svg><span>Early access to new features</span></div></div><div class="prem-plans"><div class="pp${premPlan===0?' sel':''}" onclick="premPlan=0;showPremium()"><div class="pp-dur">1 Month</div><div class="pp-price">$4.99</div><div class="pp-per">/month</div></div><div class="pp${premPlan===1?' sel':''}" onclick="premPlan=1;showPremium()"><div class="pp-dur">12 Months</div><div class="pp-price">$2.99</div><div class="pp-per">/month</div><div class="pp-save">SAVE 40%</div></div></div><button class="prem-buy" onclick="buyPrem()">Subscribe Now</button></div>`;
  o.classList.add('show');
}
function buyPrem(){
  document.getElementById('premO').classList.remove('show');
  showToast('Welcome to Vortex Premium!');
}

// PROFILE
function toggleProf(){
  profOpen=!profOpen;const pp=document.getElementById('prof'),c=C[cur];
  if(profOpen){
    const giftMsgs=c.msgs.filter(m=>m.gift);
    pp.innerHTML=`<div class="prof-cover"><div class="prof-cover-bg" style="background:${GRADS[c.grad]}"></div><div class="prof-av">${mkAv(c)}</div></div><div class="prof-info"><div class="prof-nm">${c.name}${mkBadge(c)}</div>${c.bio?`<div class="prof-bio">${c.bio}</div>`:''}<div class="prof-sts ${c.online?'on':'off'}">${c.online?'online':'last seen recently'}</div></div><div class="prof-stats"><div class="prof-stat"><div class="n">${c.msgs.length}</div><div class="l">Messages</div></div><div class="prof-stat"><div class="n">${c.msgs.filter(m=>m.img).length}</div><div class="l">Media</div></div><div class="prof-stat"><div class="n">${giftMsgs.length}</div><div class="l">Gifts</div></div></div>${giftMsgs.length?`<div class="prof-section"><h4>Gift Collection</h4><div class="prof-gifts">${giftMsgs.map(m=>`<div class="prof-gift">${gSvg(m.giftSvg,22)}</div>`).join('')}</div></div>`:''}<div class="prof-actions"><button class="prof-btn accent" onclick="toggleGifts()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7"/></svg>Send Gift</button>${c.premium?'':`<button class="prof-btn gold" onclick="showPremium()">${SVG.premBadge} Gift Premium</button>`}</div>`;
  }
  pp.classList.toggle('show',profOpen);
}

// EMOJI
function toggleEmoji(){const b=document.getElementById('ebar');b.classList.toggle('show');if(b.classList.contains('show')&&!b.innerHTML){const e=['😀','😂','🥰','😎','🤔','👍','❤️','🔥','✨','💀','😭','🥳','💯','🎉','👀','🙏','💪','🤝','😈','💎','🦄','🌟','🍕','🎸','🎭'];b.innerHTML=e.map(x=>`<span onclick="insE('${x}')">${x}</span>`).join('')}}
function insE(e){document.getElementById('msgInp').value+=e;document.getElementById('msgInp').focus()}

// MESSAGING
function sendMsg(){const inp=document.getElementById('msgInp'),t=inp.value.trim();if(!t)return;C[cur].msgs.push({w:'out',t,tm:gTime(),r:0});inp.value='';inp.style.height='auto';document.getElementById('ebar').classList.remove('show');rMsgs();rCL();if(C[cur].online)simReply()}
const RB={0:["omg yes!!","haha no way","send me the link","that's so cute","obsessed","wait really??","slayyy"],1:["diamond hands only","to the moon","rekt","based","WAGMI"],2:["hahaha stop","you're the worst","love you","omw!!","literally dying"],3:[],4:["bet","sounds good","aight","no worries bro","see you there"],5:["yesss come over!","the vibes are immaculate","cant wait!!","bring wine"],6:["noted","on it","will do","sounds good","already done"]};
function simReply(){const idx=cur,bk=RB[idx]||["ok","nice"];setTimeout(()=>{const ti=document.getElementById('typI');if(ti)ti.classList.add('show');const ms=document.getElementById('msgs');if(ms)ms.scrollTop=ms.scrollHeight},400);setTimeout(()=>{const ti=document.getElementById('typI');if(ti)ti.classList.remove('show');C[idx].msgs.push({w:'in',t:bk[Math.floor(Math.random()*bk.length)],tm:gTime()});if(idx===cur){rMsgs();rCL()}else showNotif(idx)},1800+Math.random()*1500)}
function showNotif(idx){const c=C[idx],last=c.msgs[c.msgs.length-1],n=document.getElementById('notif');n.innerHTML=`${mkAv(c,'sm')}<div><div style="font-size:12.5px;font-weight:600">${c.name}${mkBadge(c)}</div><div style="font-size:11.5px;color:var(--text2)">${last.t}</div></div>`;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),2500)}
function filterChats(q){q=q.toLowerCase();document.querySelectorAll('.ci').forEach((el,i)=>{el.style.display=C[i].name.toLowerCase().includes(q)?'flex':'none'})}

// CTX
function mCtx(e,i){e.preventDefault();const c=document.getElementById('ctx');c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';c.style.display='block';c.innerHTML=`<div class="ctx-i" onclick="hCtx()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>Reply</div><div class="ctx-i" onclick="cpM(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copy</div><div class="ctx-i" onclick="hCtx()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Forward</div><div class="ctx-i red" onclick="dlM(${i})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Delete</div>`}
function hCtx(){document.getElementById('ctx').style.display='none'}
function cpM(i){navigator.clipboard.writeText(C[cur].msgs[i].t||'');hCtx();showToast('Copied!')}
function dlM(i){C[cur].msgs.splice(i,1);rMsgs();rCL();hCtx()}
document.addEventListener('click',hCtx);

// INPUT
const mI=document.getElementById('msgInp');
mI.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
mI.addEventListener('input',()=>{mI.style.height='auto';mI.style.height=Math.min(mI.scrollHeight,100)+'px'});

// INIT
setTimeout(()=>document.getElementById('splash').classList.add('hide'),2000);
rCL();rH();rMsgs();

// Simulated incoming
setTimeout(()=>{C[2].msgs.push({w:'in',t:'btw the video already has 200 views',tm:gTime()});if(cur===2)rMsgs();else showNotif(2);rCL()},7000);
setTimeout(()=>{C[5].msgs.push({w:'in',t:'just made pasta, wish you were here',tm:gTime()});if(cur===5)rMsgs();else showNotif(5);rCL()},13000);
</script>
</body>
