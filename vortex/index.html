<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vortex</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#06060c;--s1:#0a0a15;--s2:#10101e;--s3:#181830;--s4:#222245;--a:#7c5cfc;--a2:#b44dff;--a3:#ff6b9d;--ag:linear-gradient(135deg,#7c5cfc,#b44dff,#ff6b9d);--pg:linear-gradient(135deg,#FFD700,#FF8C00);--t:#eef;--t2:#8888aa;--t3:#555570;--b:rgba(255,255,255,.04);--g:rgba(124,92,252,.12);--grn:#3ddc84;--r:12px}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}

#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .5s}
#splash.h{opacity:0;pointer-events:none}
.sl{width:64px;height:64px;border:2px solid transparent;border-top-color:var(--a);border-right-color:var(--a2);border-radius:50%;animation:sp 1s linear infinite;display:flex;align-items:center;justify-content:center}
.sl::after{content:'V';font-size:22px;font-weight:900;background:var(--ag);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes sp{to{transform:rotate(360deg)}}
.sl-t{font-size:11px;letter-spacing:5px;color:var(--t2);text-transform:uppercase}

#bgC{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3}
.app{display:flex;height:100vh;position:relative;z-index:1}

/* SIDEBAR */
.side{width:300px;min-width:300px;background:var(--s1);border-right:1px solid var(--b);display:flex;flex-direction:column}
.sh{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b)}
.sb{display:flex;align-items:center;gap:7px}.sb .m{width:28px;height:28px;border-radius:8px;background:var(--ag);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#fff}.sb span{font-weight:700;font-size:15px;background:var(--ag);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sa{display:flex;gap:1px}
.ib{width:30px;height:30px;border:0;background:0;color:var(--t2);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s}.ib:hover{background:var(--s3);color:var(--t)}.ib svg{width:16px;height:16px}
.ss{padding:4px 12px 6px;position:relative}.ss input{width:100%;padding:7px 10px 7px 30px;background:var(--s2);border:1px solid var(--b);border-radius:9px;color:var(--t);font-size:12px;outline:0;transition:.2s}.ss input:focus{border-color:rgba(124,92,252,.3)}.ss svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--t3)}
.cl{flex:1;overflow-y:auto;padding:4px 6px}
.ci{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer;transition:.12s}.ci:hover{background:rgba(124,92,252,.04)}.ci.a{background:rgba(124,92,252,.07)}
.av{width:40px;height:40px;border-radius:12px;flex-shrink:0;position:relative;overflow:visible}
.av img{width:40px;height:40px;border-radius:12px;object-fit:cover;display:block}
.av .fb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.av .on{position:absolute;bottom:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--grn);border:2px solid var(--s1);z-index:2}
.av.pr::before{content:'';position:absolute;inset:-3px;border-radius:15px;background:var(--pg);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:2px;animation:rp 3s infinite}
@keyframes rp{0%,100%{opacity:.7}50%{opacity:1}}
.ci .inf{flex:1;min-width:0}.ci .inf .tp{display:flex;align-items:center;gap:3px;margin-bottom:1px}.ci .inf .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ci .inf .tm{font-size:10px;color:var(--t3);margin-left:auto;flex-shrink:0}.ci .inf .pv{font-size:11.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{display:inline-flex;margin-left:2px;vertical-align:middle;width:13px;height:13px}
.pb svg{width:13px;height:13px}
.bdg{min-width:16px;height:16px;border-radius:8px;background:var(--ag);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
.ch{padding:9px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,21,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--b);z-index:5}
.chl{display:flex;align-items:center;gap:9px;cursor:pointer}.chl .av{width:34px;height:34px}.chl .av img,.chl .av .fb{width:34px;height:34px;border-radius:10px}.chl .av.pr::before{inset:-3px;border-radius:13px}
.chi .nm{font-size:13px;font-weight:600;display:flex;align-items:center}.chi .st{font-size:10.5px;display:flex;align-items:center;gap:3px}.chi .st.on{color:var(--grn)}.chi .st.off{color:var(--t3)}.chi .st::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.chr{display:flex;gap:1px}

.msgs{flex:1;overflow-y:auto;padding:12px 18px;display:flex;flex-direction:column;gap:2px;z-index:1}
.md{text-align:center;padding:6px 0}.md span{background:rgba(16,16,30,.85);color:var(--t3);font-size:10.5px;font-weight:500;padding:3px 10px;border-radius:6px;border:1px solid var(--b)}
.m{max-width:52%;padding:7px 11px;border-radius:13px;font-size:13px;line-height:1.5;animation:mi .2s ease both}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.m.in{align-self:flex-start;background:var(--s2);border:1px solid var(--b);border-bottom-left-radius:3px}
.m.out{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,252,.8),rgba(160,70,255,.75));border-bottom-right-radius:3px}
.mt{font-size:9px;color:rgba(255,255,255,.3);margin-top:2px;text-align:right}.m.out .mt{color:rgba(255,255,255,.45)}
.mf{font-size:10px;font-weight:600;color:var(--a);margin-bottom:1px}
.mi{border-radius:8px;overflow:hidden;margin:-2px -4px 2px;max-width:220px}.mi img{width:100%;display:block;border-radius:8px}

/* GIFT IN CHAT - BIG CENTERED */
.mg{align-self:center!important;max-width:240px!important;background:transparent!important;border:0!important;text-align:center;padding:20px 30px!important;position:relative}
.mg .g-big{width:120px;height:120px;margin:0 auto 8px;animation:gFloat 3s ease-in-out infinite}
@keyframes gFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mg .g-from{font-size:11px;color:var(--t2);margin-bottom:2px}
.mg .g-name{font-size:14px;font-weight:700;background:var(--ag);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* CONFETTI */
.confetti{position:fixed;inset:0;z-index:999;pointer-events:none}
.conf-p{position:absolute;width:8px;height:8px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* TYPING */
.typ{display:none;gap:3px;padding:7px 11px;align-self:flex-start;background:var(--s2);border:1px solid var(--b);border-radius:13px;border-bottom-left-radius:3px}.typ.sh{display:flex}
.typ span{width:5px;height:5px;background:var(--t3);border-radius:50%;animation:tb 1.2s infinite}.typ span:nth-child(2){animation-delay:.15s}.typ span:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-4px);opacity:1}}

/* INPUT */
.inp{padding:7px 14px 10px;background:rgba(10,10,21,.8);backdrop-filter:blur(16px);border-top:1px solid var(--b);display:flex;align-items:flex-end;gap:6px;z-index:5}
.inp textarea{flex:1;padding:8px 11px;background:var(--s2);border:1px solid var(--b);border-radius:10px;color:var(--t);font-size:12.5px;font-family:inherit;outline:0;resize:none;min-height:36px;max-height:90px;line-height:1.4;transition:.2s}
.inp textarea:focus{border-color:rgba(124,92,252,.3)}
.inp textarea::placeholder{color:var(--t3)}
.snd{width:36px;height:36px;border:0;border-radius:10px;background:var(--ag);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}.snd:hover{transform:scale(1.04)}.snd:active{transform:scale(.94)}.snd svg{width:15px;height:15px;fill:currentColor}

/* OVERLAYS */
.ov{position:fixed;inset:0;z-index:100;background:rgba(6,6,12,.88);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center}.ov.sh{display:flex}
.pnl{background:var(--s1);border:1px solid var(--b);border-radius:16px;overflow:hidden;transform:scale(.93);transition:.25s cubic-bezier(.34,1.4,.64,1);box-shadow:0 20px 50px rgba(0,0,0,.5)}.ov.sh .pnl{transform:scale(1)}

/* GIFT SHOP */
#gShop .pnl{width:440px;max-height:80vh}
.gs-h{padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between}
.gs-h h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.gs-h h2 span{font-size:20px}
.gs-bal{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--a);background:var(--s2);padding:5px 10px;border-radius:8px;border:1px solid var(--b)}
.gs-bal svg{width:14px;height:14px;fill:var(--a)}
.gs-to{padding:6px 18px 10px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t2)}
.gs-to strong{color:var(--t)}
.gs-cats{display:flex;gap:4px;padding:0 18px 8px;overflow-x:auto}.gs-cats::-webkit-scrollbar{display:none}
.gc{padding:5px 11px;border-radius:7px;font-size:11px;font-weight:600;background:var(--s2);color:var(--t2);border:1px solid var(--b);cursor:pointer;white-space:nowrap;transition:.12s}.gc.a{background:rgba(124,92,252,.1);color:var(--a);border-color:rgba(124,92,252,.2)}
.gs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 18px 18px;overflow-y:auto;max-height:50vh}
.gi{background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:12px 6px 8px;text-align:center;cursor:pointer;transition:.2s;position:relative}.gi:hover{transform:translateY(-2px);border-color:rgba(124,92,252,.15)}
.gi .gv{width:60px;height:60px;margin:0 auto 6px;transition:.2s}.gi:hover .gv{transform:scale(1.08)}
.gi .gn{font-size:10.5px;font-weight:600;margin-bottom:2px}.gi .gp{font-size:10px;color:var(--a);font-weight:700;display:flex;align-items:center;justify-content:center;gap:2px}
.gi .gp svg{width:10px;height:10px;fill:currentColor}
.gi .gl{position:absolute;top:4px;right:4px;font-size:7px;font-weight:800;background:var(--pg);color:#000;padding:1px 4px;border-radius:4px}

/* GIFT CONFIRM */
#gConf .pnl{width:300px;padding:24px;text-align:center}
#gConf .gv{width:100px;height:100px;margin:0 auto 10px}
#gConf h3{font-size:16px;margin-bottom:3px}
#gConf .gc-pr{font-size:13px;color:var(--a);font-weight:700;margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:4px}
#gConf .gc-to{font-size:11.5px;color:var(--t2);margin-bottom:14px}
.gc-btns{display:flex;gap:6px;justify-content:center}
.btn{padding:8px 20px;border:0;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--ag);color:#fff}.btn-p:hover{transform:scale(1.03)}
.btn-s{background:var(--s2);color:var(--t2);border:1px solid var(--b)}.btn-s:hover{background:var(--s3)}
.btn-g{background:var(--pg);color:#000}.btn-g:hover{transform:scale(1.03)}

/* PREMIUM */
#premO .pnl{width:360px}
.pr-ban{height:80px;background:linear-gradient(135deg,#1a1000,#2a1800);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pr-ban::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,215,0,.08),transparent);animation:shm 3s infinite}
@keyframes shm{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.pr-ban svg{width:44px;height:44px}
.pr-body{padding:18px}
.pr-body h2{font-size:18px;font-weight:800;text-align:center;background:var(--pg);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.pr-body .pr-sub{text-align:center;font-size:11.5px;color:var(--t2);margin-bottom:14px}
.pr-f{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.pf{display:flex;align-items:center;gap:8px;font-size:11.5px}.pf svg{width:16px;height:16px;flex-shrink:0}.pf span{color:var(--t2)}
.pr-plans{display:flex;gap:6px;margin-bottom:12px}
.pp{flex:1;background:var(--s2);border:1px solid var(--b);border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.15s}.pp:hover{border-color:rgba(255,215,0,.2)}.pp.sel{border-color:#FFD700;box-shadow:0 0 0 1px rgba(255,215,0,.1)}
.pp .pd{font-size:10px;color:var(--t2);margin-bottom:3px}.pp .ppx{font-size:16px;font-weight:800;background:var(--pg);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.pp .ppm{font-size:9px;color:var(--t3)}.pp .pps{font-size:8px;color:#FFD700;font-weight:700;margin-top:1px}
.pr-buy{width:100%;padding:10px;border:0;border-radius:10px;background:var(--pg);color:#000;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}.pr-buy:hover{transform:scale(1.02)}

/* PROFILE OVERLAY */
#profO .pnl{width:340px;max-height:85vh;overflow-y:auto}
.po-cov{height:100px;position:relative;overflow:hidden}
.po-cov-bg{position:absolute;inset:0}
.po-av{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%)}
.po-av .av{width:60px;height:60px}.po-av .av img,.po-av .av .fb{width:60px;height:60px;border-radius:18px}.po-av .av.pr::before{inset:-3px;border-radius:21px}
.po-info{padding:38px 16px 10px;text-align:center}
.po-nm{font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:1px}
.po-bio{font-size:11px;color:var(--t2);margin-bottom:4px}
.po-st{font-size:10.5px;display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:8px}.po-st.on{color:var(--grn)}.po-st.off{color:var(--t3)}.po-st::before{content:'';width:4px;height:4px;border-radius:50%;background:currentColor}
.po-acts{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.po-stats{display:flex;justify-content:center;gap:18px;padding:8px 0;border-top:1px solid var(--b);border-bottom:1px solid var(--b);margin:0 16px 10px}
.po-stat{text-align:center}.po-stat .n{font-size:14px;font-weight:700}.po-stat .l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px}
.po-sec{padding:6px 16px 14px}.po-sec h4{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);margin-bottom:6px;font-weight:600}
.po-gifts{display:flex;gap:5px;flex-wrap:wrap}
.po-gift{width:44px;height:44px;background:var(--s2);border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;overflow:hidden}.po-gift:hover{transform:scale(1.06);border-color:var(--a)}
.po-media{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.po-media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;transition:.12s}.po-media img:hover{opacity:.8}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--s2);border:1px solid rgba(124,92,252,.2);color:var(--t);padding:9px 18px;border-radius:11px;font-size:12px;font-weight:600;z-index:200;transition:.3s cubic-bezier(.34,1.4,.64,1);opacity:0;backdrop-filter:blur(14px);display:flex;align-items:center;gap:6px}.toast.sh{transform:translateX(-50%) translateY(0);opacity:1}
.notif{position:fixed;top:14px;right:14px;z-index:150;background:rgba(14,14,24,.92);backdrop-filter:blur(14px);border:1px solid rgba(124,92,252,.12);border-radius:12px;padding:9px 13px;display:flex;align-items:center;gap:8px;transform:translateX(120%);transition:.3s cubic-bezier(.34,1.4,.64,1);box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:260px}.notif.sh{transform:translateX(0)}
</style>
</head>
<body>
<canvas id="bgC"></canvas>
<div id="splash"><div class="sl"></div><div class="sl-t">Vortex</div></div>

<div class="app">
<div class="side">
  <div class="sh"><div class="sb"><div class="m">V</div><span>Vortex</span></div><div class="sa"><button class="ib" onclick="showPrem()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></button><button class="ib" onclick="openShop()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></svg></button></div></div>
  <div class="ss"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input placeholder="Search..." oninput="filt(this.value)"></div>
  <div class="cl" id="cList"></div>
</div>
<div class="main">
  <div class="ch" id="cH"></div>
  <div class="msgs" id="msgs"></div>
  <div class="inp"><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg></button><button class="ib"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg></button><textarea rows="1" placeholder="Message..." id="mInp"></textarea><button class="ib" onclick="openShop()" title="Send Gift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></svg></button><button class="snd" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button></div>
</div>
</div>

<div class="ov" id="gShop" onclick="if(event.target===this)closeOv('gShop')"><div class="pnl"><div class="gs-h"><h2><span>🎁</span> Gift Shop</h2><div class="gs-bal" id="gBal"></div></div><div class="gs-to" id="gTo"></div><div class="gs-cats" id="gCats"></div><div class="gs-grid" id="gGrid"></div></div></div>
<div class="ov" id="gConf" onclick="if(event.target===this)closeOv('gConf')"><div class="pnl" id="gcBox"></div></div>
<div class="ov" id="premO" onclick="if(event.target===this)closeOv('premO')"><div class="pnl" id="premBox"></div></div>
<div class="ov" id="profO" onclick="if(event.target===this)closeOv('profO')"><div class="pnl" id="profBox"></div></div>
<div class="toast" id="toast"></div>
<div class="notif" id="notif"></div>
<div class="confetti" id="confetti"></div>

const cv=document.getElementById('bgC'),cx=cv.getContext('2d');let ps=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();

function ap(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`rgba(124,92,252,${p.o})`;cx.fill()});for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const d=Math.hypot(ps[i].x-ps[j].x,ps[i].y-ps[j].y);if(d<90){cx.beginPath();cx.moveTo(ps[i].x,ps[i].y);cx.lineTo(ps[j].x,ps[j].y);cx.strokeStyle=`rgba(124,92,252,${.03*(1-d/90)})`;cx.stroke()}}requestAnimationFrame(ap)}ap();

function mkAv(c,sz){const w=sz||40;const p=c.pr?'pr':'';const avI=c.av?`<img src="${c.av}" style="width:${w}px;height:${w}px;border-radius:${Math.round(w*.3)}px" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:'';const fb=`<div class="fb" style="width:${w}px;height:${w}px;border-radius:${Math.round(w*.3)}px;background:${GRADS[c.g]};${c.av?'display:none':''}font-size:${Math.round(w*.38)}px">${c.l||c.name[0]}</div>`;return `<div class="av ${p}" style="width:${w}px;height:${w}px">${avI}${fb}${c.on?'<div class="on"></div>':''}</div>`}

function rMs(){const el=document.getElementById('msgs'),c=C[cur];let h=`<div class="md"><span>${c.msgs[0].tm.match(/\d/)?'Today':c.msgs[0].tm}</span></div>`;c.msgs.forEach((m,i)=>{if(m.gift){h+=`<div class="m mg" style="animation-delay:${i*.04}s"><div class="g-big">${GIFTS.find(g=>g.name===m.gift)?.svg||''}</div><div class="g-from">${m.w==='out'?'You':'${c.name}'} sent a gift</div><div class="g-name">${m.gift}</div><div class="mt">${m.tm}</div></div>`;return}let inner='';if(m.img)inner+=`<div class="mi"><img src="${m.img}" loading="lazy"></div>`;if(m.t){const t=m.t.replace(/\n/g,'<br>');inner+=(m.f?`<div class="mf">${m.f}</div>`:'')+t}const tk=m.w==='out'?'✓✓':'';h+=`<div class="m ${m.w==='out'?'out':'in'}" style="animation-delay:${i*.04}s">${inner}<div class="mt">${m.tm} ${tk}</div></div>`});h+='<div class="typ" id="typI"><span></span><span></span><span></span></div>';el.innerHTML=h;requestAnimationFrame(()=>el.scrollTop=el.scrollHeight)}

function confGift(id){confG=GIFTS.find(g=>g.id===id);if(!confG)return;const c=C[cur];const ok=balance>=confG.price;document.getElementById('gcBox').innerHTML=`<div class="gv" style="width:100px;height:100px;margin:0 auto 10px">${confG.svg}</div><h3>${confG.name}</h3><div class="gc-pr"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><text x="8" y="11.5" text-anchor="middle" font-size="9" font-weight="bold" fill="currentColor">V</text></svg>${confG.price} coins</div><div class="gc-to">Send to <strong>${c.name}</strong></div><div style="font-size:10px;color:var(--t3);margin-bottom:12px">Balance: ${balance} coins</div><div class="gc-btns"><button class="btn btn-s" onclick="closeOv('gConf')">Cancel</button><button class="btn ${ok?'btn-p':'btn-s'}" ${ok?`onclick="doGift()"`:'disabled'} style="${ok?'':'opacity:.4;cursor:default'">${ok?'Send Gift':'Not enough coins'}</button></div>`;document.getElementById('gConf').classList.add('sh')}

function doGift(){if(!confG)return;balance-=confG.price;C[cur].msgs.push({w:'out',gift:confG.name,tm:gT(),r:0});closeOv('gConf');closeOv('gShop');rMs();rCL();fireConfetti();toast(`${confG.name} sent to ${C[cur].name}!`);if(C[cur].on)simR();confG=null}

function fireConfetti(){const el=document.getElementById('confetti');const colors=['#7c5cfc','#b44dff','#ff6b9d','#FFD700','#4FC3F7','#4CAF50','#FF5722','#E91E63'];let h='';for(let i=0;i<60;i++){const c=colors[Math.floor(Math.random()*colors.length)];const l=10+Math.random()*80;const d=1+Math.random()*2;const dl=Math.random()*0.5;h+=`<div class="conf-p" style="left:${l}%;background:${c};width:${4+Math.random()*6}px;height:${4+Math.random()*6}px;animation-duration:${d}s;animation-delay:${dl}s;border-radius:${Math.random()>.5?'50%':'2px'}"></div>`}el.innerHTML=h;setTimeout(()=>el.innerHTML='',3500)}

function closeOv(id){document.getElementById(id).classList.remove('sh')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('sh');setTimeout(()=>el.classList.remove('sh'),2500)}
function filt(q){q=q.toLowerCase();document.querySelectorAll('.ci').forEach((el,i)=>{el.style.display=C[i].name.toLowerCase().includes(q)?'flex':'none'})}

function send(){const inp=document.getElementById('mInp'),t=inp.value.trim();if(!t)return;C[cur].msgs.push({w:'out',t,tm:gT(),r:0});inp.value='';inp.style.height='auto';rMs();rCL();if(C[cur].on)simR()}
const RB={0:['omg yes!!','haha no way','send me the link',"that's so cute",'obsessed','slayyy'],1:['diamond hands only','to the moon','rekt','WAGMI'],2:['hahaha stop',"you're the worst",'love you','omw!!','literally dying'],3:[],4:['bet','sounds good','no worries bro','see you there'],5:['yesss come over!','the vibes are immaculate','cant wait!!','bring wine'],6:['noted','on it','will do','sounds good']};
function simR(){const i=cur,bk=RB[i]||['ok'];setTimeout(()=>{const t=document.getElementById('typI');if(t)t.classList.add('sh');const ms=document.getElementById('msgs');if(ms)ms.scrollTop=ms.scrollHeight},400);setTimeout(()=>{const t=document.getElementById('typI');if(t)t.classList.remove('sh');C[i].msgs.push({w:'in',t:bk[Math.floor(Math.random()*bk.length)],tm:gT()});if(i===cur){rMs();rCL()}else showN(i)},1800+Math.random()*1500)}
function showN(i){const c=C[i],la=c.msgs[c.msgs.length-1],n=document.getElementById('notif');n.innerHTML=`${mkAv(c,32)}<div><div style="font-size:12px;font-weight:600">${c.name}${badge(c)}</div><div style="font-size:11px;color:var(--t2)">${la.t}</div></div>`;n.classList.add('sh');setTimeout(()=>n.classList.remove('sh'),2500)}

const mI=document.getElementById('mInp');
mI.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
mI.addEventListener('input',()=>{mI.style.height='auto';mI.style.height=Math.min(mI.scrollHeight,90)+'px'});

setTimeout(()=>document.getElementById('splash').classList.add('h'),1800);
rCL();rH();rMs();
setTimeout(()=>{C[2].msgs.push({w:'in',t:'btw the video already has 200 views',tm:gT()});if(cur===2)rMs();else showN(2);rCL()},8000);
